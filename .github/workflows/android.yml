name: Android Build & Release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # FIX 1: 'tools' package ab Android SDK me exist nahi karta.
      # Sirf 'platform-tools' maango aur licenses accept karo.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # FIX 2: Gradle khud install karo — wrapper jar banane ki zaroorat nahi.
      # Ye action Gradle ko PATH me daal deta hai aur cache bhi handle karta hai.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Repo ke andar settings.gradle dhoond kar Gradle project ka root pata karo.
      - name: Locate Gradle project
        id: findroot
        run: |
          FILE=$(find . \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle nahi mili!"
            find . -maxdepth 3 -type f -name '*.gradle*'
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Gradle project root: $DIR"
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"

      # FIX 3: Wrapper ki jagah system-installed 'gradle' command use karo.
      - name: Build Debug APK
        working-directory: ${{ steps.findroot.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.findroot.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
